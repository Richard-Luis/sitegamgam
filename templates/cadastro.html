<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../arquivo-css/cadastro.css">
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<body>
    <main id="main-cadastro">
        <div class="container-cadastro">
            <h1 class="h1-cadastro">Cadastro</h1>
            <form action="">
                <div class="label-nome">
                <label for="">Nome</label>
                <input type="text" placeholder="Nome do usuário">
                </div>

                <div class="label-email">
                <label for="">E-mail</label>
                <input type="email" placeholder="Digite seu e-mail">
                </div>

                <div class="label-senha">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Senha">
                <i id="mostrarsenha" class="fa-solid fa-eye"></i>
                <p id="errosenha"></p>
                </div>

                <button id="btncadastro">Cadastrar</button>

                <p class="cadastro-p">Já possui uma conta ? <a class="cadastro-a" href="../cadastro-login/login.html">Login</a></p>
            </form>
        </div>
    </main>
</body>
    <script src="../js/olho.js"></script>
</html>
